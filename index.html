<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Can you catch a fake?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <style>
      :root {
        --base: #fffffa;
        --deep: #0d5c63;
        --mid: #247b7b;
        --accent: #44a1a0;
        --light: #78cdd7;
        --surface: #f0fbfc;
        --surface-2: #e6f5f6;
        --text: #0d5c63;
        --muted: #247b7b;
        --border: rgba(13, 92, 99, 0.18);
        --real: #44a1a0;
        --real-soft: rgba(68, 161, 160, 0.18);
        --fake: #0d5c63;
        --fake-soft: rgba(13, 92, 99, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", "IBM Plex Sans", "Segoe UI", sans-serif;
        background: radial-gradient(
            circle at 15% 10%,
            rgba(120, 205, 215, 0.35),
            transparent 45%
          ),
          radial-gradient(
            circle at 85% 0%,
            rgba(68, 161, 160, 0.3),
            transparent 38%
          ),
          linear-gradient(180deg, var(--base) 0%, var(--surface) 100%);
        color: var(--text);
        line-height: 1.7;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: linear-gradient(
            rgba(13, 92, 99, 0.08) 1px,
            transparent 1px
          ),
          linear-gradient(
            90deg,
            rgba(13, 92, 99, 0.08) 1px,
            transparent 1px
          );
        background-size: 44px 44px;
        opacity: 0.35;
        pointer-events: none;
        z-index: -1;
      }

      img {
        max-width: 100%;
        display: block;
      }

      button,
      input {
        font-family: inherit;
      }

      button {
        border: none;
        cursor: pointer;
      }

      button:active {
        transform: scale(0.97);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }

      .app {
        max-width: 440px;
        margin: 0 auto;
        padding: 26px 18px 34px;
        min-height: 100vh;
      }

      .screen {
        display: none;
      }

      .screen.active {
        display: block;
        animation: fadeUp 0.5s ease both;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .brand {
        font-size: 12px;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        color: var(--mid);
        text-align: center;
        justify-self: center;
      }

      .brand-row {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 12px;
      }

      .brand-logos {
        display: flex;
        align-items: center;
        gap: 8px;
        justify-self: end;
      }

      .brand-logo {
        width: 36px;
        height: 36px;
        padding: 0;
        border-radius: 0;
        background: transparent;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .brand-logo img {
        height: 100%;
        width: 100%;
        object-fit: contain;
        display: block;
      }

      .logo-mark {
        width: 42px;
        height: 42px;
        border-radius: 0;
        background: transparent;
        border: none;
        padding: 0;
        display: grid;
        place-items: center;
      }

      .logo-mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        transform: scale(1.05);
        transform-origin: center;
      }

      h2 {
        font-size: 28px;
        font-weight: 600;
        margin: 10px 0 8px;
      }

      h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      .subtitle {
        margin: 0 0 8px;
        color: var(--mid);
        font-size: 14px;
      }

      .hero {
        padding: 16px 16px 18px;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        box-shadow: 0 18px 32px rgba(13, 92, 99, 0.12);
        margin-bottom: 18px;
      }

      .hero-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .chip--real {
        color: #52cfc9;
        text-shadow: 0 0 10px rgba(68, 161, 160, 0.55);
      }

      .robot-card {
        margin: 14px 0 8px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: var(--surface);
        padding: 12px;
        display: grid;
        gap: 8px;
      }

      .robot-title {
        font-size: 13px;
        font-weight: 600;
        color: var(--deep);
      }

      .robot-image {
        width: 100%;
        height: 190px;
        object-fit: contain;
        border-radius: 12px;
        background: var(--surface-2);
      }

      .robot-caption {
        font-size: 12px;
        color: var(--mid);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--surface);
        font-size: 12px;
        color: var(--mid);
        border: 1px solid var(--border);
      }

      .level-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 18px 0 16px;
      }

      .level-card {
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--surface);
        padding: 14px;
        text-align: left;
        transition: transform 0.2s ease, border 0.2s ease;
      }

      .level-card:hover {
        transform: translateY(-2px);
        border-color: rgba(13, 92, 99, 0.5);
      }

      .level-card.full {
        grid-column: span 2;
      }

      .level-card.hard {
        border: 2px solid var(--deep);
        background: #eaf6f7;
      }

      .level-card.hard .level-name,
      .level-card.hard .level-meta {
        color: var(--deep);
      }

      .level-name {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .level-name-light {
        color: #fffffa;
        text-shadow: 0 1px 6px rgba(13, 92, 99, 0.45);
      }

      .level-meta {
        font-size: 12px;
        color: var(--mid);
      }

      .fact-box {
        border-left: 3px solid var(--accent);
        padding: 12px 14px;
        background: var(--surface);
        font-size: 13px;
        color: var(--mid);
        line-height: 1.6;
      }

      .footer {
        margin-top: 16px;
        font-size: 12px;
        color: var(--mid);
      }

      .top-bar {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        font-size: 13px;
      }

      .level-badge {
        justify-self: start;
        padding: 5px 12px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 12px;
        background: var(--surface-2);
        color: var(--deep);
        border: 1px solid var(--border);
      }

      .counter-block {
        text-align: center;
      }

      .question-counter {
        font-weight: 600;
      }

      .endless-banner {
        font-size: 11px;
        color: var(--accent);
        margin-top: 2px;
      }

      .score-block {
        justify-self: end;
        text-align: right;
        font-size: 12px;
        color: var(--mid);
      }

      .hidden {
        display: none;
      }

      .timer-track {
        width: 100%;
        height: 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        overflow: hidden;
        margin-bottom: 12px;
      }

      .timer-fill {
        height: 100%;
        width: 100%;
        background: var(--real);
        transition: width 0.1s linear;
      }

      .score-dots {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 6px;
        margin-bottom: 14px;
      }

      .dot {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--surface);
      }

      .dot-correct {
        background: rgba(68, 161, 160, 0.35);
        border-color: #52cfc9;
        box-shadow: 0 0 14px rgba(82, 207, 201, 0.7);
      }

      .dot-wrong {
        background: rgba(226, 75, 74, 0.2);
        border-color: #e24b4a;
        box-shadow: 0 0 6px rgba(226, 75, 74, 0.35);
      }

      .card-wrapper {
        position: relative;
        margin-bottom: 10px;
      }

      .image-card {
        position: relative;
        height: 330px;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: var(--surface);
        overflow: hidden;
        touch-action: pan-y;
        user-select: none;
        box-shadow: 0 18px 30px rgba(13, 92, 99, 0.18);
      }

      .image-card.card-enter {
        animation: cardEnter 0.45s ease both;
      }

      .image-card.hard-motion {
        animation: cardEnter 0.45s ease both, slowPulse 5s ease-in-out infinite;
      }

      @keyframes cardEnter {
        from {
          opacity: 0;
          transform: translateY(6px) scale(0.98);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes slowPulse {
        0% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.015);
        }

        100% {
          transform: scale(1);
        }
      }

      .image-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .hint {
        position: absolute;
        top: 50%;
        transform: translateY(-50%) scale(1);
        font-size: 20px;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 8px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s ease;
      }

      .hint.fake {
        left: 12px;
        color: var(--fake);
        border: 2px solid var(--fake);
        background: var(--fake-soft);
      }

      .hint.real {
        right: 12px;
        color: #52cfc9;
        text-shadow: 0 0 12px rgba(68, 161, 160, 0.6);
        border: 2px solid var(--real);
        background: var(--real-soft);
      }

      .answer-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 18px;
        font-weight: 600;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s ease;
        pointer-events: none;
        padding: 18px;
      }

      .answer-overlay.show {
        opacity: 1;
        visibility: visible;
      }

      .overlay-correct {
        background: rgba(68, 161, 160, 0.25);
        color: var(--deep);
      }

      .overlay-wrong {
        background: rgba(13, 92, 99, 0.25);
        color: var(--deep);
      }

      .instruction {
        text-align: center;
        color: var(--mid);
        font-size: 13px;
        margin: 8px 0 12px;
      }

      .action-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .action-button {
        padding: 12px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 2px solid transparent;
        transition: transform 0.2s ease, background 0.2s ease;
      }

      .action-button.fake {
        background: var(--surface-2);
        border-color: var(--accent);
        color: var(--accent);
        text-shadow: 0 0 10px rgba(120, 205, 215, 0.45);
      }

      .action-button.real {
        background: var(--surface-2);
        border-color: var(--accent);
        color: var(--accent);
        text-shadow: 0 0 10px rgba(120, 205, 215, 0.45);
      }

      .action-button.try {
        background: var(--light);
        border-color: var(--accent);
        color: var(--deep);
      }

      .action-button.neutral {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--deep);
      }

      .action-button.accent {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }

      .action-button.small {
        padding: 8px 12px;
        font-size: 12px;
        border-radius: 999px;
      }

      .results-header {
        margin-bottom: 8px;
      }

      .metric-card {
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--surface);
        padding: 18px;
        text-align: center;
        font-size: 28px;
        font-weight: 600;
        margin: 12px 0 6px;
        box-shadow: 0 16px 26px rgba(13, 92, 99, 0.18);
      }

      .metric-sub {
        text-align: center;
        color: var(--mid);
        font-size: 12px;
        margin-bottom: 12px;
      }

      .verdict {
        margin: 0 0 12px;
        color: var(--mid);
      }

      .results-actions {
        display: grid;
        gap: 10px;
        margin: 16px 0;
      }

      .fun-fact {
        margin: 12px 0 6px;
        font-size: 13px;
        color: var(--mid);
      }

      .leaderboard-card {
        border-radius: 16px;
        border: 1px solid var(--border);
        background: var(--surface);
        padding: 14px;
        margin: 16px 0;
        box-shadow: 0 16px 24px rgba(13, 92, 99, 0.18);
      }

      .leaderboard-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .level-pill {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--deep);
      }

      .leaderboard-submit {
        display: grid;
        gap: 6px;
        margin-bottom: 10px;
      }

      .input-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }

      input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface-2);
        font-size: 14px;
        color: var(--deep);
      }

      .hint-text {
        font-size: 12px;
        color: var(--mid);
      }

      .leaderboard-table {
        display: grid;
        gap: 6px;
      }

      .leaderboard-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .level-toggle {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }

      .level-pill.active {
        background: rgba(68, 161, 160, 0.25);
        color: #52cfc9;
        border: 1px solid rgba(82, 207, 201, 0.65);
      }

      .leaderboard-row {
        display: grid;
        grid-template-columns: 36px 1fr 70px;
        gap: 8px;
        align-items: center;
        padding: 6px 8px;
        border-radius: 10px;
        background: var(--surface-2);
        font-size: 13px;
        color: var(--deep);
      }

      .leaderboard-row span:nth-child(2) {
        color: var(--text);
        text-shadow: 0 0 10px rgba(120, 205, 215, 0.45);
      }

      .leaderboard-row span:nth-child(1) {
        color: var(--muted);
        text-shadow: none;
      }

      .leaderboard-row span:nth-child(3) {
        color: #52cfc9;
        text-shadow: 0 0 12px rgba(82, 207, 201, 0.65);
      }

      .leaderboard-row.header {
        background: transparent;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--mid);
      }

      @media (max-width: 380px) {
        .image-card {
          height: 280px;
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --base: #0c1719;
          --surface: #122226;
          --surface-2: #142b31;
          --text: #f1ffff;
          --muted: #c3f0f2;
          --mid: #8fd4d8;
          --border: rgba(120, 205, 215, 0.2);
        }

        body::before {
          background-image: linear-gradient(
              rgba(120, 205, 215, 0.08) 1px,
              transparent 1px
            ),
            linear-gradient(
              90deg,
              rgba(120, 205, 215, 0.08) 1px,
              transparent 1px
            );
        }

        .hero,
        .level-card,
        .fact-box,
        .timer-track,
        .image-card,
        .metric-card,
        .leaderboard-card {
          box-shadow: none;
        }

        input[type="text"] {
          background: #0c1d22;
          color: var(--text);
        }
      }
    </style>
  </head>
  <body>
    <h1 class="sr-only">
      Can you catch a fake? A deepfake detection game by Tracera, Cairo University
    </h1>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const LEADERBOARD_ENDPOINT =
        "https://script.google.com/macros/s/AKfycbxWajgu84zDiO8QsD1IkNOkOz6B-6paXztUwgs-WFlULbMWh9cAbKoXi6ECiJQal3on/exec";
      const LEADERBOARD_LIMIT = 10;

      const REAL_IMAGE_COUNT = 5000;
      const FAKE_IMAGE_COUNT = 2630;
      const HARD_REAL_EVERY = 19;
      const HARD_FAKE_EVERY = 13;
      const HARD_BASE_ROUND = 10;
      const HARD_UNLOCK_SCORE = 9;
      const HARD_MAX_MISTAKES = 2;

      function padNumber(value) {
        return String(value).padStart(6, "0");
      }

      function buildImageList(folder, count, options) {
        const list = [];
        for (let i = 1; i <= count; i += 1) {
          const padded = padNumber(i);
          const isHard = options.hardEvery ? i % options.hardEvery === 0 : false;
          const label = options.label
            ? options.label
            : i % 2 === 0
              ? options.labelEven
              : options.labelOdd;
          list.push({
            url: `${folder}/${padded}.jpg`,
            label,
            hard: isHard,
          });
        }
        return list;
      }

      const REAL_IMAGES = buildImageList("images/real", REAL_IMAGE_COUNT, {
        label: "Real photo",
        hardEvery: HARD_REAL_EVERY,
      });

      const FAKE_IMAGES = buildImageList("images/fake", FAKE_IMAGE_COUNT, {
        labelEven: "AI-generated (GAN)",
        labelOdd: "AI-generated (Diffusion)",
        hardEvery: HARD_FAKE_EVERY,
      });

      const LEVELS = {
        easy: { name: "Easy", time: 10, pass: 5 },
        medium: { name: "Medium", time: 5, pass: 7 },
        hard: { name: "Hard", time: 2, pass: HARD_UNLOCK_SCORE },
      };

      const FUN_FACTS = [
        "Diffusion models are 6.6 percentage points easier to detect than GANs - their training process leaves stronger mathematical anomalies.",
        "The single most important detection feature GramNet uses is spectral slope - the rate at which energy decays across neural network layers.",
        "GramNet was trained on 160,000 images spanning 26+ different AI generators including StyleGAN, DALL-E 3, Midjourney, and Stable Diffusion.",
        "AI generators leave an invisible fingerprint in the second-moment statistics of neural network activations - GramNet reads this fingerprint.",
        "GramNet's attribution head can tell GAN-generated from Diffusion-generated images with 96.35% accuracy - it knows not just that an image is fake, but what made it.",
        "The human eye detects deepfakes at roughly 50-70% accuracy under pressure - barely better than a coin flip.",
        "GramNet extracts a 2,382-dimensional mathematical feature vector from each image - then classifies it in milliseconds.",
      ];

      const FEEDBACK_DELAYS = {
        easy: 800,
        medium: 700,
        hard: 400,
      };

      function shuffle(list) {
        const array = list.slice();
        for (let i = array.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }

      function pickWithHardPriority(items, count) {
        const hardItems = items.filter((item) => item.hard);
        const normalItems = items.filter((item) => !item.hard);
        const picked = shuffle(hardItems).slice(0, count);
        if (picked.length < count) {
          picked.push(...shuffle(normalItems).slice(0, count - picked.length));
        }
        return picked;
      }

      function buildQueue(level, count) {
        const realCount = Math.floor(count / 2);
        const fakeCount = count - realCount;
        const realPick =
          level === "hard"
            ? pickWithHardPriority(REAL_IMAGES, realCount)
            : shuffle(REAL_IMAGES).slice(0, realCount);
        const fakePick =
          level === "hard"
            ? pickWithHardPriority(FAKE_IMAGES, fakeCount)
            : shuffle(FAKE_IMAGES).slice(0, fakeCount);
        const combined = [
          ...realPick.map((item) => ({ ...item, real: true })),
          ...fakePick.map((item) => ({ ...item, real: false })),
        ];
        return shuffle(combined);
      }

      function App() {
        const [screen, setScreen] = React.useState("home");
        const [currentLevel, setCurrentLevel] = React.useState("easy");
        const [queue, setQueue] = React.useState([]);
        const [currentIdx, setCurrentIdx] = React.useState(0);
        const [correctCount, setCorrectCount] = React.useState(0);
        const [results, setResults] = React.useState([]);
        const [mistakes, setMistakes] = React.useState(0);
        const [totalAnswered, setTotalAnswered] = React.useState(0);
        const [endlessUnlocked, setEndlessUnlocked] = React.useState(false);
        const [hardWon, setHardWon] = React.useState(false);
        const [gameEndReason, setGameEndReason] = React.useState("");
        const [overlay, setOverlay] = React.useState({
          show: false,
          correct: false,
          text: "",
        });
        const [funFact, setFunFact] = React.useState("");
        const [leaderboard, setLeaderboard] = React.useState([]);
        const [leaderboardStatus, setLeaderboardStatus] = React.useState("");
        const [submitStatus, setSubmitStatus] = React.useState("");
        const [playerName, setPlayerName] = React.useState("");
        const [submitted, setSubmitted] = React.useState(false);
        const [homeLeaderboardOpen, setHomeLeaderboardOpen] = React.useState(false);
        const [homeLeaderboardLevel, setHomeLeaderboardLevel] = React.useState("easy");

        const timerRef = React.useRef(null);
        const timeLeftRef = React.useRef(0);
        const totalTimeRef = React.useRef(LEVELS.easy.time);
        const answeredRef = React.useRef(false);
        const advanceRef = React.useRef(null);
        const cardRef = React.useRef(null);
        const canvasRef = React.useRef(null);
        const timerFillRef = React.useRef(null);
        const hintFakeRef = React.useRef(null);
        const hintRealRef = React.useRef(null);
        const dragRef = React.useRef({ active: false, startX: 0, currentX: 0 });
        const flipRef = React.useRef(false);

        const isHard = currentLevel === "hard";
        const showDots = !isHard || currentIdx < HARD_BASE_ROUND;
        const showHints = !isHard;

        const leaderboardEnabled = LEADERBOARD_ENDPOINT.trim().length > 0;

        function resetCardPosition() {
          if (!cardRef.current) {
            return;
          }
          cardRef.current.style.transition = "none";
          cardRef.current.style.transform = "translateX(0px) rotate(0deg)";
          cardRef.current.style.opacity = "1";
          if (hintFakeRef.current) {
            hintFakeRef.current.style.opacity = "0";
          }
          if (hintRealRef.current) {
            hintRealRef.current.style.opacity = "0";
          }
        }

        function updateTimerBar(percent) {
          const clamped = Math.max(0, Math.min(100, percent));
          if (!timerFillRef.current) {
            return;
          }
          timerFillRef.current.style.width = `${clamped}%`;
          timerFillRef.current.setAttribute("aria-valuenow", Math.round(clamped));
          if (clamped > 50) {
            timerFillRef.current.style.background = "var(--real)";
          } else if (clamped > 25) {
            timerFillRef.current.style.background = "var(--accent)";
          } else {
            timerFillRef.current.style.background = "var(--deep)";
          }
        }

        function clearTimer() {
          if (timerRef.current) {
            clearInterval(timerRef.current);
            timerRef.current = null;
          }
        }

        function startTimer() {
          clearTimer();
          timeLeftRef.current = totalTimeRef.current;
          updateTimerBar(100);
          timerRef.current = setInterval(() => {
            timeLeftRef.current = Math.max(
              0,
              Number((timeLeftRef.current - 0.1).toFixed(1))
            );
            const percent =
              (timeLeftRef.current / totalTimeRef.current) * 100;
            updateTimerBar(percent);
            if (timeLeftRef.current <= 0) {
              clearTimer();
              autoFail();
            }
          }, 100);
        }

        function animateCardOut(direction) {
          if (!cardRef.current) {
            return;
          }
          const offset = direction > 0 ? 120 : -120;
          const rotate = direction > 0 ? 15 : -15;
          cardRef.current.style.transition =
            "transform 0.35s ease, opacity 0.35s ease";
          cardRef.current.style.transform =
            `translateX(${offset}%) rotate(${rotate}deg)`;
          cardRef.current.style.opacity = "0";
        }

        function updateHints(deltaX) {
          if (!showHints) {
            return;
          }
          const opacity = Math.min(Math.abs(deltaX) / 80, 1);
          if (deltaX < 0) {
            if (hintFakeRef.current) {
              hintFakeRef.current.style.opacity = String(opacity);
            }
            if (hintRealRef.current) {
              hintRealRef.current.style.opacity = "0";
            }
          } else if (deltaX > 0) {
            if (hintRealRef.current) {
              hintRealRef.current.style.opacity = String(opacity);
            }
            if (hintFakeRef.current) {
              hintFakeRef.current.style.opacity = "0";
            }
          } else {
            if (hintFakeRef.current) {
              hintFakeRef.current.style.opacity = "0";
            }
            if (hintRealRef.current) {
              hintRealRef.current.style.opacity = "0";
            }
          }
        }

        function handleDragMove(deltaX) {
          if (!cardRef.current) {
            return;
          }
          const rotation = deltaX * 0.05;
          cardRef.current.style.transform =
            `translateX(${deltaX}px) rotate(${rotation}deg)`;
          updateHints(deltaX);
        }

        function endDrag() {
          dragRef.current.active = false;
          if (answeredRef.current) {
            return;
          }
          const threshold = 70;
          if (Math.abs(dragRef.current.currentX) > threshold) {
            answer(dragRef.current.currentX > 0 ? "real" : "fake");
          } else {
            if (!cardRef.current) {
              return;
            }
            cardRef.current.style.transition = "transform 0.2s ease";
            cardRef.current.style.transform = "translateX(0px) rotate(0deg)";
            updateHints(0);
          }
        }

        function handlePointerDown(event) {
          if (answeredRef.current) {
            return;
          }
          dragRef.current.active = true;
          dragRef.current.startX = event.clientX;
          dragRef.current.currentX = 0;
          if (cardRef.current) {
            cardRef.current.setPointerCapture(event.pointerId);
            cardRef.current.style.transition = "none";
          }
        }

        function handlePointerMove(event) {
          if (!dragRef.current.active || answeredRef.current) {
            return;
          }
          dragRef.current.currentX = event.clientX - dragRef.current.startX;
          handleDragMove(dragRef.current.currentX);
        }

        function handlePointerUp() {
          if (!dragRef.current.active) {
            return;
          }
          endDrag();
        }

        function handlePointerCancel() {
          if (!dragRef.current.active) {
            return;
          }
          endDrag();
        }

        function applyGrain(ctx, width, height) {
          ctx.save();
          ctx.globalAlpha = 0.08;
          ctx.fillStyle = "#0d5c63";
          for (let i = 0; i < 240; i += 1) {
            const x = Math.random() * width;
            const y = Math.random() * height;
            const size = Math.random() * 1.6 + 0.4;
            ctx.fillRect(x, y, size, size);
          }
          ctx.restore();
        }

        function drawImageToCanvas(item) {
          const canvas = canvasRef.current;
          const card = cardRef.current;
          if (!canvas || !card) {
            return;
          }
          const rect = card.getBoundingClientRect();
          if (rect.width === 0 || rect.height === 0) {
            return;
          }
          const ratio = window.devicePixelRatio || 1;
          canvas.width = rect.width * ratio;
          canvas.height = rect.height * ratio;
          canvas.style.width = `${rect.width}px`;
          canvas.style.height = `${rect.height}px`;
          const ctx = canvas.getContext("2d");
          ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
          ctx.clearRect(0, 0, rect.width, rect.height);

          const img = new Image();
          img.onload = () => {
            const scale = Math.max(
              rect.width / img.width,
              rect.height / img.height
            );
            const drawWidth = img.width * scale;
            const drawHeight = img.height * scale;
            const dx = (rect.width - drawWidth) / 2;
            const dy = (rect.height - drawHeight) / 2;

            const fakeScale = isHard ? 0.45 : 0.55;
            const pixelScale = item.real ? 1 : fakeScale;

            if (pixelScale < 1) {
              const tempCanvas = document.createElement("canvas");
              const tctx = tempCanvas.getContext("2d");
              const pw = Math.max(1, Math.floor(drawWidth * pixelScale));
              const ph = Math.max(1, Math.floor(drawHeight * pixelScale));
              tempCanvas.width = pw;
              tempCanvas.height = ph;
              tctx.imageSmoothingEnabled = false;
              tctx.drawImage(img, 0, 0, pw, ph);
              ctx.imageSmoothingEnabled = false;
              if (!item.real) {
                ctx.save();
                ctx.filter = isHard ? "blur(0.8px)" : "blur(0.6px)";
                ctx.drawImage(
                  tempCanvas,
                  0,
                  0,
                  pw,
                  ph,
                  dx,
                  dy,
                  drawWidth,
                  drawHeight
                );
                ctx.restore();
              } else {
                ctx.drawImage(
                  tempCanvas,
                  0,
                  0,
                  pw,
                  ph,
                  dx,
                  dy,
                  drawWidth,
                  drawHeight
                );
              }
            } else {
              ctx.imageSmoothingEnabled = true;
              ctx.drawImage(img, dx, dy, drawWidth, drawHeight);
            }

            // Only fake images get subtle pixelation; real images stay sharp.
          };
          img.src = item.url;

          canvas.style.transform = flipRef.current ? "scaleX(-1)" : "scaleX(1)";
        }

        function ensureEndlessBuffer() {
          if (!isHard || !endlessUnlocked) {
            return;
          }
          setQueue((prev) => {
            if (prev.length - currentIdx < 6) {
              return prev.concat(buildQueue("hard", HARD_BASE_ROUND));
            }
            return prev;
          });
        }

        function startGame(level) {
          setCurrentLevel(level);
          setQueue(buildQueue(level, HARD_BASE_ROUND));
          setCurrentIdx(0);
          setCorrectCount(0);
          setResults([]);
          setMistakes(0);
          setTotalAnswered(0);
          setEndlessUnlocked(false);
          setHardWon(false);
          setGameEndReason("");
          setOverlay({ show: false, correct: false, text: "" });
          setPlayerName("");
          setSubmitted(false);
          setSubmitStatus("");
          totalTimeRef.current = LEVELS[level].time;
          setScreen("game");
        }

        function endGame() {
          clearTimer();
          if (advanceRef.current) {
            clearTimeout(advanceRef.current);
            advanceRef.current = null;
          }
          setScreen("results");
          const randomFact = FUN_FACTS[Math.floor(Math.random() * FUN_FACTS.length)];
          setFunFact(randomFact);
        }

        function answer(choice) {
          if (answeredRef.current || currentIdx >= queue.length) {
            return;
          }
          answeredRef.current = true;
          clearTimer();
          if (advanceRef.current) {
            clearTimeout(advanceRef.current);
            advanceRef.current = null;
          }

          const item = queue[currentIdx];
          const isCorrect =
            choice === "real" ? item.real : choice === "fake" ? !item.real : false;

          setTotalAnswered((prev) => prev + 1);
          setCorrectCount((prev) => (isCorrect ? prev + 1 : prev));
          setMistakes((prev) => (isCorrect ? prev : prev + 1));

          if (showDots) {
            setResults((prev) => prev.concat(isCorrect));
          }

          const overlayText = isCorrect
            ? `Correct! - ${item.label}`
            : `Wrong - ${item.label}`;
          setOverlay({ show: true, correct: isCorrect, text: overlayText });

          animateCardOut(choice === "real" ? 1 : -1);

          const isLastBase = isHard && currentIdx === HARD_BASE_ROUND - 1;

          let nextCorrect = correctCount + (isCorrect ? 1 : 0);
          let nextMistakes = mistakes + (isCorrect ? 0 : 1);

          if (isLastBase && nextCorrect >= HARD_UNLOCK_SCORE) {
            setEndlessUnlocked(true);
            setHardWon(true);
          }

          let shouldEnd = false;
          let reason = "";
          if (isHard) {
            if (nextMistakes >= HARD_MAX_MISTAKES) {
              shouldEnd = true;
              reason = "mistakes";
            }
            if (isLastBase && nextCorrect < HARD_UNLOCK_SCORE) {
              shouldEnd = true;
              reason = "gate";
            }
          } else if (currentIdx >= HARD_BASE_ROUND - 1) {
            shouldEnd = true;
            reason = "complete";
          }

          advanceRef.current = setTimeout(() => {
            if (shouldEnd) {
              setGameEndReason(reason);
              endGame();
            } else {
              setCurrentIdx((prev) => prev + 1);
            }
          }, FEEDBACK_DELAYS[currentLevel]);
        }

        function autoFail() {
          answer("timeout");
        }

        async function submitScore() {
          if (!leaderboardEnabled) {
            setSubmitStatus("Leaderboard endpoint is missing.");
            return;
          }
          if (submitted) {
            setSubmitStatus("Score already submitted.");
            return;
          }
          const trimmed = playerName.trim();
          if (trimmed.length < 2) {
            setSubmitStatus("Please enter at least 2 characters.");
            return;
          }

          setSubmitStatus("Submitting score...");
          const payload = {
            name: trimmed,
            level: currentLevel,
            score: correctCount,
            correct: correctCount,
            mistakes,
            totalAnswered,
            won: hardWon || !isHard,
            timestamp: new Date().toISOString(),
          };

          try {
            const response = await fetch(LEADERBOARD_ENDPOINT, {
              method: "POST",
              headers: {
                "Content-Type": "text/plain;charset=utf-8",
              },
              body: JSON.stringify(payload),
            });
            if (!response.ok) {
              throw new Error("Submit failed");
            }
            setSubmitted(true);
            setSubmitStatus("Score submitted.");
            await loadLeaderboard(currentLevel);
          } catch (error) {
            setSubmitStatus("Could not submit score.");
          }
        }

        async function loadLeaderboard(level) {
          if (!leaderboardEnabled) {
            setLeaderboardStatus("Add an endpoint to enable scores.");
            setLeaderboard([]);
            return;
          }
          setLeaderboardStatus("Loading leaderboard...");
          setLeaderboard([]);
          try {
            const response = await fetch(
              `${LEADERBOARD_ENDPOINT}?level=${encodeURIComponent(level)}&limit=${LEADERBOARD_LIMIT}`,
              { cache: "no-store" }
            );
            if (!response.ok) {
              throw new Error("Fetch failed");
            }
            const data = await response.json();
            if (!Array.isArray(data) || data.length === 0) {
              setLeaderboardStatus("No scores yet.");
              setLeaderboard([]);
              return;
            }
            setLeaderboardStatus("");
            setLeaderboard(data.slice(0, LEADERBOARD_LIMIT));
          } catch (error) {
            setLeaderboardStatus("Could not load leaderboard.");
            setLeaderboard([]);
          }
        }

        React.useEffect(() => {
          if (screen !== "game") {
            clearTimer();
            return;
          }
          if (currentIdx >= queue.length) {
            endGame();
            return;
          }
          answeredRef.current = false;
          setOverlay({ show: false, correct: false, text: "" });
          resetCardPosition();
          flipRef.current = isHard ? Math.random() < 0.5 : false;
          const item = queue[currentIdx];
          drawImageToCanvas(item);
          startTimer();
        }, [screen, currentIdx, queue, currentLevel]);

        React.useEffect(() => {
          ensureEndlessBuffer();
        }, [currentIdx, endlessUnlocked, currentLevel]);

        React.useEffect(() => {
          if (screen === "results") {
            loadLeaderboard(currentLevel);
          }
        }, [screen, currentLevel]);

        React.useEffect(() => {
          if (screen === "home" && homeLeaderboardOpen) {
            loadLeaderboard(homeLeaderboardLevel);
          }
        }, [screen, homeLeaderboardOpen, homeLeaderboardLevel]);

        React.useEffect(() => {
          function handleResize() {
            if (screen === "game" && queue[currentIdx]) {
              drawImageToCanvas(queue[currentIdx]);
            }
          }
          window.addEventListener("resize", handleResize);
          return () => window.removeEventListener("resize", handleResize);
        }, [screen, queue, currentIdx, currentLevel]);

        const pass = correctCount >= LEVELS[currentLevel].pass;
        const verdictText = isHard
          ? gameEndReason === "gate"
            ? "You did not reach 9 of 10, so endless mode stayed locked."
            : hardWon
              ? "Winner unlocked. Find a Tracera team member for your prize."
              : "Hard run ended."
          : pass
            ? "You passed. Try hard to unlock endless mode."
            : "Did not pass - GramNet does this with 93% accuracy.";

        return (
          <main className="app">
            <section className={`screen ${screen === "home" ? "active" : ""}`}>
              <div className="hero">
                <div className="brand-row">
                  <div className="logo-mark">
                    <img src="images/logo11.png" alt="Tracera logo" />
                  </div>
                  <div className="brand">TRACERA - CAIRO UNIVERSITY</div>
                  <div className="brand-logos">
                    <div className="brand-logo">
                      <img
                        src="images/cufe.png"
                        alt="Cairo University logo"
                      />
                    </div>
                    <div className="brand-logo">
                      <img
                        src="images/koleya_white.png"
                        alt="Faculty of Engineering logo"
                      />
                    </div>
                  </div>
                </div>
                <h2>Can you catch a fake?</h2>
                <p className="subtitle">
                  Swipe right for real, swipe left for fake. Tap buttons if you
                  prefer.
                </p>
                <div className="hero-chips">
                  <div className="chip">
                    <i className="ti ti-arrow-right" aria-hidden="true"></i>
                    <span className="chip--real">Real is right</span>
                  </div>
                  <div className="chip">
                    <i className="ti ti-arrow-left" aria-hidden="true"></i>
                    Fake is left
                  </div>
                  <div className="chip">
                    <i className="ti ti-clock" aria-hidden="true"></i>
                    Hard is 2s
                  </div>
                </div>
              </div>

              <div className="robot-card">
                <div className="robot-title">Meet the model guide</div>
                <img
                  className="robot-image"
                  src="images/robo2t.png"
                  alt="GramNet robot preview"
                />
                <div className="robot-caption">
                  Our robot character represents GramNet's mathematical engine.
                  Beat its accuracy to claim the top spot.
                </div>
              </div>

              <div className="level-grid">
                <button
                  className="level-card"
                  data-level="easy"
                  aria-label="Play easy level"
                  onClick={() => startGame("easy")}
                >
                  <div className="level-name level-name-light">Easy</div>
                  <div className="level-meta">
                    10 seconds per image - pass 5 of 10.
                  </div>
                </button>
                <button
                  className="level-card"
                  data-level="medium"
                  aria-label="Play medium level"
                  onClick={() => startGame("medium")}
                >
                  <div className="level-name level-name-light">Medium</div>
                  <div className="level-meta">
                    5 seconds per image - pass 7 of 10.
                  </div>
                </button>
                <button
                  className="level-card full hard"
                  data-level="hard"
                  aria-label="Play hard endless level"
                  onClick={() => startGame("hard")}
                >
                  <div className="level-name">Hard - endless</div>
                  <div className="level-meta">
                    2 seconds per image - reach 9 of 10 to unlock endless. Game
                    ends on 2 total mistakes.
                  </div>
                </button>
              </div>

              <div className="leaderboard-card">
                <div className="leaderboard-header">
                  <h3>Leaderboard</h3>
                  <div className="leaderboard-toggle">
                    <button
                      className="action-button neutral small"
                      onClick={() =>
                        setHomeLeaderboardOpen((prev) => !prev)
                      }
                      aria-label="Toggle leaderboard"
                    >
                      {homeLeaderboardOpen ? "Hide" : "View"}
                    </button>
                  </div>
                </div>
                {homeLeaderboardOpen ? (
                  <>
                    <div className="level-toggle">
                      {Object.keys(LEVELS).map((levelKey) => (
                        <button
                          key={levelKey}
                          className={
                            `level-pill ${
                              homeLeaderboardLevel === levelKey ? "active" : ""
                            }`
                          }
                          onClick={() => setHomeLeaderboardLevel(levelKey)}
                          aria-label={`Show ${LEVELS[levelKey].name} leaderboard`}
                        >
                          {LEVELS[levelKey].name}
                        </button>
                      ))}
                    </div>
                    <div className="leaderboard-table">
                      <div className="leaderboard-row header">
                        <span>#</span>
                        <span>Name</span>
                        <span>Score</span>
                      </div>
                      {leaderboard.length === 0 ? (
                        <div className="hint-text">{leaderboardStatus}</div>
                      ) : (
                        leaderboard.map((entry, index) => (
                          <div key={index} className="leaderboard-row">
                            <span>{index + 1}</span>
                            <span>{entry.name || "Player"}</span>
                            <span>{entry.score ?? "-"}</span>
                          </div>
                        ))
                      )}
                    </div>
                  </>
                ) : (
                  <div className="hint-text">
                    View top scores from each level.
                  </div>
                )}
              </div>

              <div className="fact-box">
                Our AI (GramNet) detects deepfakes with 93% accuracy by analyzing
                the mathematical fingerprint each generator leaves behind. Can
                you beat it?
              </div>
              <div className="footer">
                Tracera Team - Cairo University - supervised by Prof. Dr. Samah
                Elshafiey
              </div>
            </section>

            <section className={`screen ${screen === "game" ? "active" : ""}`}>
              <div className="top-bar">
                <span className="level-badge">{LEVELS[currentLevel].name}</span>
                <div className="counter-block">
                  <div className="question-counter">
                    {isHard && endlessUnlocked
                      ? `Endless: ${totalAnswered} answered`
                      : `${currentIdx + 1} / ${HARD_BASE_ROUND}`}
                  </div>
                  {isHard && endlessUnlocked ? (
                    <div className="endless-banner">Endless mode unlocked</div>
                  ) : null}
                </div>
                <div className="score-block">
                  <div>{correctCount} correct</div>
                  {isHard ? <div>{mistakes} mistakes</div> : null}
                </div>
              </div>
              <div className="timer-track">
                <div
                  ref={timerFillRef}
                  className="timer-fill"
                  role="progressbar"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="100"
                ></div>
              </div>
              {showDots ? (
                <div className="score-dots">
                  {Array.from({ length: HARD_BASE_ROUND }).map((_, index) => {
                    const status = results[index];
                    const classes = ["dot"];
                    if (status === true) {
                      classes.push("dot-correct");
                    }
                    if (status === false) {
                      classes.push("dot-wrong");
                    }
                    return <div key={index} className={classes.join(" ")}></div>;
                  })}
                </div>
              ) : null}
              <div className="card-wrapper">
                <div
                  ref={cardRef}
                  className={`image-card ${isHard ? "hard-motion" : ""}`}
                  aria-live="polite"
                  onPointerDown={handlePointerDown}
                  onPointerMove={handlePointerMove}
                  onPointerUp={handlePointerUp}
                  onPointerCancel={handlePointerCancel}
                >
                  <canvas
                    ref={canvasRef}
                    className="image-canvas"
                    role="img"
                    aria-label="Face image - decide if real or AI-generated"
                  ></canvas>
                  <div ref={hintFakeRef} className="hint fake">
                    FAKE
                  </div>
                  <div ref={hintRealRef} className="hint real">
                    REAL
                  </div>
                  <div
                    className={
                      `answer-overlay ${overlay.show ? "show" : ""} ` +
                      (overlay.correct ? "overlay-correct" : "overlay-wrong")
                    }
                  >
                    <span>{overlay.text}</span>
                  </div>
                </div>
              </div>
              <div className="instruction">Swipe or tap a button</div>
              <div className="action-buttons">
                <button
                  className="action-button fake"
                  aria-label="Answer fake"
                  onClick={() => answer("fake")}
                >
                  <i className="ti ti-arrow-left" aria-hidden="true"></i>
                  Fake
                </button>
                <button
                  className="action-button real"
                  aria-label="Answer real"
                  onClick={() => answer("real")}
                >
                  Real
                  <i className="ti ti-arrow-right" aria-hidden="true"></i>
                </button>
              </div>
            </section>

            <section className={`screen ${screen === "results" ? "active" : ""}`}>
              <div className="results-header">
                <h2>{LEVELS[currentLevel].name} level</h2>
              </div>
              <div className="metric-card">
                {isHard ? `${correctCount} correct` : `${correctCount} / 10`}
              </div>
              <div className="metric-sub">
                {isHard
                  ? `Mistakes: ${mistakes} of 1 allowed · Total answered: ${totalAnswered}`
                  : ""}
              </div>
              <p className="verdict">{verdictText}</p>
              <div className="score-dots">
                {Array.from({ length: HARD_BASE_ROUND }).map((_, index) => {
                  const status = results[index];
                  const classes = ["dot"];
                  if (status === true) {
                    classes.push("dot-correct");
                  }
                  if (status === false) {
                    classes.push("dot-wrong");
                  }
                  return <div key={index} className={classes.join(" ")}></div>;
                })}
              </div>
              <div className="fun-fact">{funFact}</div>

              <div className="leaderboard-card">
                <div className="leaderboard-header">
                  <h3>Leaderboard</h3>
                  <span className="level-pill">{LEVELS[currentLevel].name}</span>
                </div>
                <div className="leaderboard-submit">
                  <label className="sr-only" htmlFor="player-name">
                    Your name
                  </label>
                  <div className="input-row">
                    <input
                      id="player-name"
                      type="text"
                      maxLength="18"
                      placeholder="Your name"
                      aria-label="Player name"
                      value={playerName}
                      onChange={(event) => setPlayerName(event.target.value)}
                      onKeyDown={(event) => {
                        if (event.key === "Enter") {
                          submitScore();
                        }
                      }}
                    />
                    <button
                      className="action-button accent"
                      aria-label="Submit score"
                      onClick={submitScore}
                      disabled={!leaderboardEnabled}
                    >
                      Submit
                    </button>
                  </div>
                  <div className="hint-text">{submitStatus}</div>
                </div>
                <div className="leaderboard-table">
                  <div className="leaderboard-row header">
                    <span>#</span>
                    <span>Name</span>
                    <span>Score</span>
                  </div>
                  {leaderboard.length === 0 ? (
                    <div className="hint-text">{leaderboardStatus}</div>
                  ) : (
                    leaderboard.map((entry, index) => (
                      <div key={index} className="leaderboard-row">
                        <span>{index + 1}</span>
                        <span>{entry.name || "Player"}</span>
                        <span>{entry.score ?? "-"}</span>
                      </div>
                    ))
                  )}
                </div>
              </div>

              <div className="results-actions">
                <button
                  className="action-button try"
                  aria-label="Try again"
                  onClick={() => startGame(currentLevel)}
                >
                  Try again
                </button>
                <button
                  className="action-button neutral"
                  aria-label="Change level"
                  onClick={() => {
                    setScreen("home");
                  }}
                >
                  Change level
                </button>
              </div>
              <div className="fact-box">
                GramNet analyzes Gram matrix eigenvalue patterns invisible to the
                human eye - it sees the mathematical ghost every AI generator
                leaves behind.
              </div>
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
